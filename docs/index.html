<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Weather & Snow Forecast</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="status">Loading Global Weather & Snow Forecast...</div>
  <iframe
    id="omni-frame"
    allow="clipboard-write; microphone; fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    async function initOmniEmbed() {
      const statusEl = document.getElementById("status");
      const iframe = document.getElementById("omni-frame");

      try {
        const res = await fetch("https://omni-embed-session.felipe-aac.workers.dev");
        const data = await res.json();

        if (!res.ok || !data.url) {
          throw new Error(data.error || JSON.stringify(data));
        }

        iframe.onload = () => {
          statusEl.style.display = "none";
        };
        iframe.src = data.url;
      } catch (err) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Embed Error: " + err.message;
        console.error("Omni Embed Error:", err);
      }
    }

    initOmniEmbed();
  </script>
</body>
</html>
